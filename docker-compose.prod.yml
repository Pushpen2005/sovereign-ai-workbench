# SovereignAI Production Hardened Docker Compose Configuration
#
# Production Security Invariants:
# 1. Zero external host port exposure for data stores (PostgreSQL, Qdrant, ai-service).
# 2. Only Frontend (port 80) and Backend API (port 9000) are reachable from host/network ingress.
# 3. All internal services communicate strictly over the private bridge network 'sovereign_net'.
# 4. Mandatory health checks and restart policies enabled.
# 5. Log rotation enforced across all containers (max-size 10m, max-file 3).

services:
  postgres:
    image: postgres:16-alpine
    container_name: sovereign-ai-postgres
    restart: always
    # Production Hardening: NO host port exposure (Internal to sovereign_net only)
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workbench_db}
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workbench} -d ${POSTGRES_DB:-workbench_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sovereign_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sovereign-ai-qdrant
    restart: always
    # Production Hardening: NO host port exposure (Internal to sovereign_net only)
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sovereign_net

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: sovereign-ai-service
    restart: always
    # Production Hardening: NO host port exposure (Internal to sovereign_net only)
    expose:
      - "5001"
    environment:
      DOCKER_CONTAINER: "true"
      PORT: 5001
      NODE_ENV: production
      QDRANT_URL: http://qdrant:6333
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gemma-2-2b-it-4bit}
      DOCUMENT_MODEL: ${DOCUMENT_MODEL:-gemma-2-2b-it-4bit}
      INSPECTION_MODEL: ${INSPECTION_MODEL:-gemma-2-2b-it-4bit}
      RISK_MODEL: ${RISK_MODEL:-gemma-2-2b-it-4bit}
      GEMMA_MLX_URL: ${GEMMA_MLX_URL:-http://host.docker.internal:8080}
      GEMMA_MLX_MODEL: ${GEMMA_MLX_MODEL:-gemma-2-2b-it-4bit}
      GEMMA_MLX_TIMEOUT_MS: ${GEMMA_MLX_TIMEOUT_MS:-120000}
      MLX_RUNTIME_MANAGED: "false"
      CODING_MODEL: ${CODING_MODEL:-qwen2.5-coder:3b-4bit}
      CODING_MLX_ENABLED: ${CODING_MLX_ENABLED:-true}
      QWEN_CODER_MLX_URL: ${QWEN_CODER_MLX_URL:-http://host.docker.internal:8081}
      QWEN_CODER_MODEL: ${QWEN_CODER_MODEL:-qwen2.5-coder:3b-4bit}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5-vl:3b-4bit}
      VISION_MLX_ENABLED: ${VISION_MLX_ENABLED:-true}
      QWEN_VL_MLX_URL: ${QWEN_VL_MLX_URL:-http://host.docker.internal:8082}
      QWEN_VL_MODEL: ${QWEN_VL_MODEL:-qwen2.5-vl:3b-4bit}
      QWEN_VL_SERVER_MODEL: ${QWEN_VL_SERVER_MODEL:-models/qwen2.5-vl-3b-4bit}
      QWEN_VL_TIMEOUT_MS: ${QWEN_VL_TIMEOUT_MS:-60000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sovereign_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sovereign-ai-backend
    restart: always
    ports:
      - "9000:9000"
    environment:
      DOCKER_CONTAINER: "true"
      PORT: 9000
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench_secret}
      POSTGRES_DB: ${POSTGRES_DB:-workbench_db}
      QDRANT_URL: http://qdrant:6333
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gemma-2-2b-it-4bit}
      DOCUMENT_MODEL: ${DOCUMENT_MODEL:-gemma-2-2b-it-4bit}
      INSPECTION_MODEL: ${INSPECTION_MODEL:-gemma-2-2b-it-4bit}
      RISK_MODEL: ${RISK_MODEL:-gemma-2-2b-it-4bit}
      GEMMA_MLX_URL: ${GEMMA_MLX_URL:-http://host.docker.internal:8080}
      GEMMA_MLX_MODEL: ${GEMMA_MLX_MODEL:-gemma-2-2b-it-4bit}
      GEMMA_MLX_TIMEOUT_MS: ${GEMMA_MLX_TIMEOUT_MS:-120000}
      MLX_RUNTIME_MANAGED: "false"
      CODING_MODEL: ${CODING_MODEL:-qwen2.5-coder:3b-4bit}
      CODING_MLX_ENABLED: ${CODING_MLX_ENABLED:-true}
      QWEN_CODER_MLX_URL: ${QWEN_CODER_MLX_URL:-http://host.docker.internal:8081}
      QWEN_CODER_MODEL: ${QWEN_CODER_MODEL:-qwen2.5-coder:3b-4bit}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5-vl:3b-4bit}
      VISION_MLX_ENABLED: ${VISION_MLX_ENABLED:-true}
      QWEN_VL_MLX_URL: ${QWEN_VL_MLX_URL:-http://host.docker.internal:8082}
      QWEN_VL_MODEL: ${QWEN_VL_MODEL:-qwen2.5-vl:3b-4bit}
      QWEN_VL_SERVER_MODEL: ${QWEN_VL_SERVER_MODEL:-models/qwen2.5-vl-3b-4bit}
      QWEN_VL_TIMEOUT_MS: ${QWEN_VL_TIMEOUT_MS:-60000}
      AI_SERVICE_URL: http://ai-service:5001
      DEFAULT_ORGANIZATION_ID: ${DEFAULT_ORGANIZATION_ID:-0bd5dba2-05e1-4f5c-9047-25843d338622}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME:-Demo Organization}
      PYTHON_PATH: python3
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/backend/src/uploads
      - reports_data:/app/backend/generated
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sovereign_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9000}
    container_name: sovereign-ai-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sovereign_net

volumes:
  postgres_data:
    name: postgres_data
  qdrant_storage:
    name: qdrant_storage
  uploads_data:
    name: uploads_data
  reports_data:
    name: reports_data

networks:
  sovereign_net:
    driver: bridge
