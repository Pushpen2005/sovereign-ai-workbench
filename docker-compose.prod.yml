# SovereignAI Production Hardened Docker Compose Configuration
#
# Production Security Invariants:
# 1. Zero external host port exposure for data & AI stores (PostgreSQL, Qdrant, Ollama, ai-service).
# 2. Only Frontend (port 80) and Backend API (port 9000) are reachable from host/network ingress.
# 3. All internal services communicate strictly over the private bridge network 'sovereign_net'.
# 4. Mandatory health checks and restart policies enabled.
# 5. Log rotation enforced across all containers (max-size 10m, max-file 3).

services:
  postgres:
    image: postgres:16-alpine
    container_name: sovereign-ai-postgres
    restart: always
    # Production Hardening: NO host port exposure (Internal to sovereign_net only)
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workbench_db}
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workbench} -d ${POSTGRES_DB:-workbench_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sovereign_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sovereign-ai-qdrant
    restart: always
    # Production Hardening: NO host port exposure (Internal to sovereign_net only)
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sovereign_net

  ollama:
    image: ollama/ollama:latest
    container_name: sovereign-ai-ollama
    restart: always
    # Production Hardening: NO host port exposure (Internal to sovereign_net only)
    expose:
      - "11434"
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sovereign_net

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: sovereign-ai-service
    restart: always
    # Production Hardening: NO host port exposure (Internal to sovereign_net only)
    expose:
      - "5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-llama3.2:3b}
      DOCUMENT_MODEL: ${DOCUMENT_MODEL:-llama3.2:3b}
      CODING_MODEL: ${CODING_MODEL:-llama3.2:3b}
      CODING_MODEL_FALLBACK: ${CODING_MODEL_FALLBACK:-true}
      VISION_MODEL: ${VISION_MODEL:-moondream}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sovereign_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sovereign-ai-backend
    restart: always
    ports:
      - "9000:9000"
    environment:
      PORT: 9000
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench_secret}
      POSTGRES_DB: ${POSTGRES_DB:-workbench_db}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-llama3.2:3b}
      DOCUMENT_MODEL: ${DOCUMENT_MODEL:-llama3.2:3b}
      CODING_MODEL: ${CODING_MODEL:-llama3.2:3b}
      CODING_MODEL_FALLBACK: ${CODING_MODEL_FALLBACK:-true}
      VISION_MODEL: ${VISION_MODEL:-moondream}
      AI_SERVICE_URL: http://ai-service:5001
      DEFAULT_ORGANIZATION_ID: ${DEFAULT_ORGANIZATION_ID:-0bd5dba2-05e1-4f5c-9047-25843d338622}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME:-Demo Organization}
      PYTHON_PATH: python3
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/backend/src/uploads
      - reports_data:/app/backend/generated
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sovereign_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9000}
    container_name: sovereign-ai-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sovereign_net

volumes:
  postgres_data:
    external: true
  qdrant_storage:
    external: true
  ollama_data:
    external: true
  uploads_data:
  reports_data:

networks:
  sovereign_net:
    driver: bridge
